[package]
name = "renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
log = "0.4"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "gles", "std", "vulkan", "wgsl"] }

eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.17.2"
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland"] }
cpal = "0.18.2"
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
tokio-stream = "0.1.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
